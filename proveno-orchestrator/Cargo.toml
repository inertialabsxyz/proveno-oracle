[package]
name = "proveno-orchestrator"
version.workspace = true
edition.workspace = true
default-run = "proveno-orchestrator"

[dependencies]
proveno = { workspace = true }
proveno-zk = { workspace = true }
proveno-agent = { path = ".." }
proveno-witness = { workspace = true }
proveno-noir = { workspace = true }
proveno-verifier = { workspace = true }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "blocking"] }
clap = { version = "4", features = ["derive"] }
sha2.workspace = true
dotenvy.workspace = true

[features]
# Enables the slow end-to-end Noir prove/verify integration test. Requires
# `nargo` and `bb` on PATH; off by default so plain `cargo test` stays fast.
noir-prove = []

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "proveno-orchestrator"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
