[package]
name = "proveno-agent"
version.workspace = true
edition.workspace = true

[workspace]
members = ["proveno-orchestrator", "proveno-demo"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
proveno = { git = "https://github.com/inertialabsxyz/proveno-core.git", tag = "v0.2.0" }
proveno-zk = { git = "https://github.com/inertialabsxyz/proveno-zk.git", tag = "v0.1.0" }
proveno-witness = { git = "https://github.com/inertialabsxyz/proveno-zk.git", tag = "v0.1.0" }
proveno-noir = { git = "https://github.com/inertialabsxyz/proveno-zk.git", tag = "v0.1.0" }
proveno-verifier = { git = "https://github.com/inertialabsxyz/proveno-zk.git", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hex = "0.4"
dotenvy = "0.15"
tempfile = "3"

[features]
default = ["std", "tls"]
# The TLS module carries cfgs from when it lived in the no_std-capable core
# crate. Declared here so those cfgs resolve rather than warning.
std = ["proveno/std"]
serde = ["dep:serde", "proveno/serde"]
tls = ["dep:p256", "dep:p384", "dep:x509-cert", "dep:webpki-roots", "dep:rsa"]

[dependencies]
proveno = { workspace = true }
sha2.workspace = true
serde = { workspace = true, optional = true }
p256 = { optional = true, version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { optional = true, version = "0.13", default-features = false, features = ["ecdsa"] }
x509-cert = { optional = true, version = "0.2", default-features = false }
webpki-roots = { optional = true, version = "0.26" }
rsa = { version = "0.9", default-features = false, optional = true }

[dev-dependencies]
serde_json.workspace = true
rustls = { version = "0.23", features = ["std"] }
